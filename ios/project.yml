# Progetto Xcode generato con XcodeGen: `cd ios && xcodegen generate`.
# Il file generato (Gradus.xcodeproj) è nel repo per aprirlo subito; se cambia questo file, rigeneralo.
name: Gradus
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  bundleIdPrefix: dev.binarybuilders
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Il team di firma NON sta qui né nel .xcodeproj (si perderebbe a ogni `xcodegen generate`): è in
    # Config/Secrets.xcconfig, che non si rigenera mai (vedi Secrets.example.xcconfig).
    CODE_SIGN_STYLE: Automatic
packages:
  Domain:
    path: Domain
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Gradus:
    type: application
    platform: iOS
    sources:
      - App
      - Data
      - Features
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gradus
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        SiteURL: $(SITE_URL)
    dependencies:
      - package: Domain
      - package: GRDB
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.binarybuilders.gradus
        PRODUCT_NAME: Gradus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  GradusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Gradus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.binarybuilders.gradus.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gradus:
    build:
      targets:
        Gradus: all
    test:
      targets:
        - GradusTests
