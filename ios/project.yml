# Progetto Xcode generato con XcodeGen: `cd ios && xcodegen generate`.
# Il file generato (Gradus.xcodeproj) è nel repo per aprirlo subito; se cambia questo file, rigeneralo.
name: Gradus
options:
  bundleIdPrefix: dev.binarybuilders
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Da impostare con il proprio account sviluppatore (Signing & Capabilities) per provarla sull'iPhone.
    DEVELOPMENT_TEAM: ""
packages:
  Domain:
    path: Domain
targets:
  Gradus:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Resources
    dependencies:
      - package: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.binarybuilders.gradus
        PRODUCT_NAME: Gradus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gradus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  GradusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Gradus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.binarybuilders.gradus.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gradus:
    build:
      targets:
        Gradus: all
    test:
      targets:
        - GradusTests
