name: web

on:
  pull_request:
    paths: ['web/**', 'supabase/**', 'fixtures/**', '.github/workflows/web.yml']
  push:
    branches: [prod]
    paths: ['web/**', 'supabase/**', 'fixtures/**', '.github/workflows/web.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
