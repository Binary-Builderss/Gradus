name: web

on:
  # Sulle PR gira sempre: `check` è richiesto dalla regola che protegge prod, e una PR che tocca solo ios/ resterebbe
  # in attesa per sempre di un controllo che non parte.
  pull_request:
  push:
    branches: [prod]
    paths: ['web/**', 'supabase/**', 'fixtures/**', '.github/workflows/web.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Le fixture condivise e il test SQL generato coincidono
        run: node ../fixtures/generate-sql.mjs --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
