# Deploy del sito coach (web/). Le variabili VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY si impostano
# nella dashboard di Netlify: solo URL e chiave anon/publishable, mai la service_role.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Salta il build se non cambia nulla in web/ (né in questo file): migrazioni, documentazione e
  # codice di supabase/ non consumano crediti. Exit 0 = salta, exit 1 = costruisci; senza commit di
  # riferimento (primo build) git diff fallisce e il build parte. Il comando gira dentro `base`.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# SPA: ogni percorso (/login, /nuova-password, ...) lo risolve il router nel browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
